syntax = "proto3";
package logaggregator;

option java_package = "com.logaggregator.proto";
option java_outer_classname = "MetricsProto";

message AgentInfo {
  string agent_id = 1;
  string hostname = 2;
  string ip_address = 3;
  string os_type = 4;
  string os_version = 5;
  uint64 boot_time = 6;
  string agent_version = 7;
}

message CpuMetrics {
  double user_percent = 1;
  double system_percent = 2;
  double idle_percent = 3;
  double iowait_percent = 4;
  double steal_percent = 5;
  uint32 core_count = 6;
  double load_avg_1m = 7;
  double load_avg_5m = 8;
  double load_avg_15m = 9;
  repeated PerCoreUsage per_core = 10;
}

message PerCoreUsage {
  uint32 core_id = 1;
  double usage_percent = 2;
}

message MemoryMetrics {
  uint64 total_bytes = 1;
  uint64 available_bytes = 2;
  uint64 used_bytes = 3;
  double used_percent = 4;
  uint64 swap_total_bytes = 5;
  uint64 swap_used_bytes = 6;
  uint64 buffers_bytes = 7;
  uint64 cached_bytes = 8;
}

message DiskMetrics {
  repeated DiskDevice devices = 1;
}

message DiskDevice {
  string device_name = 1;
  uint64 reads_completed = 2;
  uint64 writes_completed = 3;
  uint64 read_bytes = 4;
  uint64 write_bytes = 5;
  double read_rate_bps = 6;
  double write_rate_bps = 7;
  double utilization_percent = 8;
  uint64 total_bytes = 9;
  uint64 used_bytes = 10;
  double used_percent = 11;
}

message NetworkMetrics {
  repeated NetworkInterface interfaces = 1;
}

message NetworkInterface {
  string name = 1;
  uint64 bytes_sent = 2;
  uint64 bytes_recv = 3;
  uint64 packets_sent = 4;
  uint64 packets_recv = 5;
  uint64 errors_in = 6;
  uint64 errors_out = 7;
  double send_rate_bps = 8;
  double recv_rate_bps = 9;
}

message LogEntry {
  string source = 1;
  string level = 2;
  string message = 3;
  uint64 timestamp_ms = 4;
  map<string, string> tags = 5;
}

message MetricPayload {
  AgentInfo agent_info = 1;
  uint64 timestamp_ms = 2;
  uint64 collection_duration_ms = 3;
  CpuMetrics cpu = 4;
  MemoryMetrics memory = 5;
  DiskMetrics disk = 6;
  NetworkMetrics network = 7;
  repeated LogEntry logs = 8;
  uint32 sequence_number = 9;
  bool is_recovery_data = 10;
  uint32 priority = 11;
}

message MetricBatch {
  repeated MetricPayload payloads = 1;
  string batch_id = 2;
  uint64 created_at_ms = 3;
  uint32 payload_count = 4;
  bool compressed = 5;
}

message ServerAck {
  string batch_id = 1;
  bool success = 2;
  string error_message = 3;
  uint64 server_timestamp_ms = 4;
  uint32 next_interval_ms = 5;
}

message AgentRegistration {
  AgentInfo agent_info = 1;
  uint64 registration_time_ms = 2;
  repeated string requested_metrics = 3;
  uint32 collection_interval_ms = 4;
}

message RegistrationResponse {
  bool accepted = 1;
  string assigned_agent_id = 2;
  uint32 collection_interval_ms = 3;
  repeated string collect_metrics = 4;
  map<string, string> config = 5;
}
