# ==============================================================================
# Ingestion Gateway - Default Configuration
# ==============================================================================
# This file provides the default configuration for the ingestion gateway.
# All values can be overridden via environment variables using the pattern:
#   GATEWAY_<SECTION>_<KEY> (e.g., GATEWAY_SERVER_PORT=9091)
# ==============================================================================

server:
  host: "0.0.0.0"
  port: 9090
  boss_threads: 2
  worker_threads: 8
  max_frame_size_bytes: 10485760  # 10 MB

storage:
  influxdb:
    url: "http://influxdb:8086"
    token: "my-super-secret-token"
    org: "log-aggregator"
    bucket: "metrics"
    batch_size: 1000
    flush_interval_ms: 1000
  postgres:
    host: "postgres"
    port: 5432
    database: "log_aggregator"
    username: "aggregator"
    password: "aggregator_pass"
    max_pool_size: 10

pipeline:
  validation:
    max_age_hours: 24
    max_future_seconds: 60
  sanitization:
    max_log_message_length: 4096
  aggregation:
    window_sizes_sec: [60, 300, 900]

logging:
  level: "INFO"
  pattern: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
