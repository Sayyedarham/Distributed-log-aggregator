# ============================================================================
# Telegraf Configuration
# Distributed Log Aggregator - Gateway Monitoring
# ============================================================================
# This configuration monitors the gateway service itself, collecting
# internal metrics about the host running the gateway and the gateway
# application's performance.
# ============================================================================

# Global agent configuration
[agent]
  ## Interval for data collection
  interval = "10s"
  ## Rounds collection to interval
  round_interval = true
  ## Maximum number of metrics to buffer
  metric_buffer_limit = 10000
  ## Batch size for output
  metric_batch_size = 1000
  ## Flush interval for outputs
  flush_interval = "10s"
  ## Jitter for flush interval to stagger writes
  flush_jitter = "2s"
  ## Override default hostname
  hostname = ""
  ## Omit hostname tag
  omit_hostname = false
  ## Collect metrics about telegraf itself
  debug = false
  quiet = false
  logtarget = "stderr"

# ---------------------------------------------------------------------------
# OUTPUT: InfluxDB v2
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  ## InfluxDB v2 URL
  urls = ["http://influxdb:8086"]
  ## Token for authentication
  token = "${INFLUXDB_TOKEN}"
  ## Organization
  organization = "log-aggregator"
  ## Destination bucket
  bucket = "gateway_metrics"
  ## Timeout for HTTP requests
  timeout = "5s"
  ## Content encoding (gzip recommended for network efficiency)
  content_encoding = "gzip"

# ---------------------------------------------------------------------------
# INPUT: CPU Metrics
# ---------------------------------------------------------------------------
[[inputs.cpu]]
  ## Report per-cpu stats
  percpu = true
  ## Report total system cpu stats
  totalcpu = true
  ## Collect CPU time metrics
  collect_cpu_time = false
  ## Report active/busy CPU time
  report_active = false
  ## Core tags
  core_tags = false

# ---------------------------------------------------------------------------
# INPUT: Memory Metrics
# ---------------------------------------------------------------------------
[[inputs.mem]]
  # No additional configuration needed

# ---------------------------------------------------------------------------
# INPUT: Disk Usage
# ---------------------------------------------------------------------------
[[inputs.disk]]
  ## Ignore specific filesystem types
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# ---------------------------------------------------------------------------
# INPUT: Disk I/O
# ---------------------------------------------------------------------------
[[inputs.diskio]]
  ## Devices to include (empty = all)
  # devices = ["sda", "sdb"]

# ---------------------------------------------------------------------------
# INPUT: Network Interface Stats
# ---------------------------------------------------------------------------
[[inputs.net]]
  ## Interfaces to include (empty = all)
  # interfaces = ["eth0"]
  ## Ignore protocol stats
  ignore_protocol_stats = false

# ---------------------------------------------------------------------------
# INPUT: System Load & Uptime
# ---------------------------------------------------------------------------
[[inputs.system]]
  # No additional configuration needed

# ---------------------------------------------------------------------------
# INPUT: Process Metrics
# ---------------------------------------------------------------------------
[[inputs.processes]]
  # No additional configuration needed

# ---------------------------------------------------------------------------
# INPUT: Docker Container Metrics (if gateway runs in Docker)
# ---------------------------------------------------------------------------
# [[inputs.docker]]
#   ## Docker endpoint
#   endpoint = "unix:///var/run/docker.sock"
#   ## Container names to include
#   container_name_include = ["log-aggregator-gateway*"]
#   ## Timeout for docker API
#   timeout = "5s"
#   ## Only collect from running containers
#   perdevice = true
#   total = false

# ---------------------------------------------------------------------------
# INPUT: HTTP Response (Gateway Health Check)
# ---------------------------------------------------------------------------
[[inputs.http_response]]
  ## Gateway health endpoint
  urls = ["http://gateway:8080/health"]
  ## Response timeout
  response_timeout = "5s"
  ## HTTP method
  method = "GET"
  ## Follow redirects
  follow_redirects = false
  ## Expected response substring
  response_string_match = "ok"
  ## Measurement name override
  [inputs.http_response.tags]
    service = "gateway"

# ---------------------------------------------------------------------------
# INPUT: Prometheus Metrics (from Gateway /metrics endpoint)
# ---------------------------------------------------------------------------
# Uncomment if the gateway exposes Prometheus-format metrics
# [[inputs.prometheus]]
#   ## Gateway metrics endpoint
#   urls = ["http://gateway:8080/metrics"]
#   ## Metric version controls the mapping from Prometheus to Telegraf
#   metric_version = 2
#   ## Measurement name prefix
#   name_prefix = "gateway_"

# ---------------------------------------------------------------------------
# INPUT: Internal Telegraf Metrics
# ---------------------------------------------------------------------------
[[inputs.internal]]
  ## Collect metrics about telegraf plugins
  collect_memstats = true
  [inputs.internal.tags]
    service = "telegraf"

# ---------------------------------------------------------------------------
# PROCESSOR: Rename Measurements
# ---------------------------------------------------------------------------
[[processors.rename]]
  ## Rename measurements for consistency with our schema
  [[processors.rename.replace]]
    measurement = "cpu"
    dest = "gateway_cpu"
  [[processors.rename.replace]]
    measurement = "mem"
    dest = "gateway_memory"
  [[processors.rename.replace]]
    measurement = "disk"
    dest = "gateway_disk"
  [[processors.rename.replace]]
    measurement = "net"
    dest = "gateway_network"
