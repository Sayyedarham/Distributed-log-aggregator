# ============================================================================
# Grafana Dashboard Provisioning
# Distributed Log Aggregator - Visualization Layer
# ============================================================================
# Automatically provisions dashboards from JSON files when Grafana starts.
# Mounted at /etc/grafana/provisioning/dashboards/
# Dashboard JSON files are at /var/lib/grafana/dashboards/
# ============================================================================

apiVersion: 1

providers:
  - name: 'Log Aggregator'
    orgId: 1
    folder: 'Log Aggregator'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
